<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tictactoe.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="gameBoard" >
        <div boxIndex="0" class="gameBox">X</div>
        <div boxIndex="1" class="gameBox">X</div>
        <div boxIndex="2" class="gameBox">X</div>
        <div boxIndex="3" class="gameBox">X</div>
        <div boxIndex="4" class="gameBox">X</div>
        <div boxIndex="5" class="gameBox">X</div>
        <div boxIndex="6" class="gameBox">X</div>
        <div boxIndex="7" class="gameBox">X</div>
        <div boxIndex="8" class="gameBox">X</div>
    </div>
</body>
<script href="js/tictactoe.js"></script>
</html>
